<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171B" media="(prefers-color-scheme: dark)">
<title>Taccuino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@1,400&display=swap">
<style>
:root{padding-top:0}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: bacheca a colonne in stile Keep; editor a tutto schermo su telefono, pannello a destra su PC.
   Tokens: carta fredda, inchiostro, blu oltremare; schede pastello che si scuriscono nel tema scuro. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --fg:#1A1C1E; --muted:#5C6166; --line:#DADDD8; --soft:#ECEDEA;
  --accent:#2F4BD6; --accent-fg:#FFFFFF; --accent-soft:#EEF1FD; --accent-ink:#22359A; --danger:#B42318;
  --scrim:rgba(15,17,20,.45); --veil-rgb:255,255,255; --shadow:0 8px 30px rgba(0,0,0,.16);
  --n-white:#FFFFFF; --n-yellow:#FFF3BF; --n-green:#DCF2E3; --n-blue:#DDE8FB; --n-pink:#F9E1EA;
  --n-gray:#ECEDEA; --n-orange:#FFE0C2; --n-purple:#E8E0F7;
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --panel:min(560px, 46vw);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171B; --surface:#1F2228; --fg:#ECEDEE; --muted:#A0A6AD; --line:#33373F; --soft:#2A2D33;
  --accent:#8EA2F0; --accent-fg:#101218; --accent-soft:#262E4A; --accent-ink:#C3CEF7; --danger:#F08A7E;
  --scrim:rgba(0,0,0,.6); --veil-rgb:21,23,27; --shadow:0 8px 30px rgba(0,0,0,.5);
  --n-white:#23262C; --n-yellow:#4A4222; --n-green:#23402E; --n-blue:#243552; --n-pink:#4A2A37;
  --n-gray:#2E3136; --n-orange:#4D3420; --n-purple:#362C4D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1F2228; --fg:#ECEDEE; --muted:#A0A6AD; --line:#33373F; --soft:#2A2D33;
  --accent:#8EA2F0; --accent-fg:#101218; --accent-soft:#262E4A; --accent-ink:#C3CEF7; --danger:#F08A7E;
  --scrim:rgba(0,0,0,.6); --veil-rgb:21,23,27; --shadow:0 8px 30px rgba(0,0,0,.5);
  --n-white:#23262C; --n-yellow:#4A4222; --n-green:#23402E; --n-blue:#243552; --n-pink:#4A2A37;
  --n-gray:#2E3136; --n-orange:#4D3420; --n-purple:#362C4D; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-sans); font-size:15px; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.ic{width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ic.s{width:16px; height:16px}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- bacheca */
#app{min-height:100%; padding-left:var(--gut-l); padding-right:var(--gut-r); box-sizing:border-box}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; gap:8px; align-items:center; padding-block:14px 8px; background:var(--bg)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.search{flex:1; min-width:0; height:48px; border-radius:24px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 16px; color:var(--muted)}
.search input{flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:15px; color:var(--fg)}
.round{width:48px; height:48px; border-radius:24px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--fg); flex:none}
.subbar{display:flex; align-items:center; gap:8px; padding-block:2px 10px; font-size:13px; color:var(--muted); flex-wrap:wrap}
.subbar .grow{flex:1}
.ghost{border:0; background:transparent; color:var(--muted); display:inline-flex; align-items:center; gap:6px; padding:6px 4px; font-size:13px}
.fchip{display:inline-flex; align-items:center; gap:4px; height:28px; border-radius:14px; background:var(--accent-soft); color:var(--accent-ink); padding:0 4px 0 10px; font-size:12px; border:0}
.fchip .ic{width:14px; height:14px}
.board{columns:164px; column-gap:10px; padding-bottom:140px}
@media (min-width:700px){ .board{columns:220px; column-gap:14px} }
.card{break-inside:avoid; display:block; width:100%; margin:0 0 10px; position:relative; overflow:hidden; text-align:left;
  background:var(--nbg,var(--n-white)); color:var(--fg); border:1px solid color-mix(in srgb, var(--fg) 9%, transparent); border-radius:14px; padding:12px 14px; box-sizing:border-box; cursor:pointer; user-select:none; -webkit-user-select:none}
.card:hover{border-color:color-mix(in srgb, var(--fg) 22%, transparent)}
.card > *{position:relative}
.card .crop{margin:-12px -14px 10px; border-radius:0}
.card h3{margin:0 0 6px; font-size:15px; font-weight:600; text-wrap:balance; overflow-wrap:anywhere}
.card p{margin:0; font-size:13px; line-height:1.45; white-space:pre-line; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:8; -webkit-box-orient:vertical; overflow:hidden}
.card .cq{font-family:var(--f-serif); font-style:italic; font-size:14px; -webkit-line-clamp:6}
.card .cq-src{font-family:var(--f-mono); font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; gap:6px; align-items:center}
.card ul{margin:4px 0 0; padding:0; list-style:none; font-size:13px; display:flex; flex-direction:column; gap:3px}
.card li{display:flex; gap:7px; align-items:baseline}
.card li::before{content:""; width:11px; height:11px; border:1.5px solid currentColor; border-radius:3px; flex:none; transform:translateY(1px); opacity:.7}
.card li.done{text-decoration:line-through; color:var(--muted)}
.card li.done::before{background:currentColor}
.card .meta{display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-family:var(--f-mono); font-size:11px; color:var(--muted); align-items:center}
.card .meta .icons{display:flex; gap:6px; align-items:center; flex:none}
.card .meta .ic{width:14px; height:14px}
.card .labels{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.card.pinned::after{content:""; position:absolute; top:10px; right:10px; width:7px; height:7px; border-radius:4px; background:var(--accent)}
.empty{max-width:420px; margin:48px auto; text-align:center; color:var(--muted); line-height:1.5}
.empty b{display:block; color:var(--fg); font-size:17px; margin-bottom:6px}

.quick{position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:6px; align-items:center;
  background:var(--surface); border-top:1px solid var(--line);
  padding:10px var(--gut-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.quick-new{flex:1; min-width:0; height:48px; border-radius:12px; border:0; background:var(--bg); color:var(--muted); text-align:left; padding:0 16px; font-size:15px}
.ib{width:44px; height:44px; border:0; background:transparent; color:var(--fg); display:flex; align-items:center; justify-content:center; flex:none; border-radius:10px}
.ib:hover{background:color-mix(in srgb, var(--fg) 7%, transparent)}
@media (min-width:900px){ .quick{left:50%; right:auto; transform:translateX(-50%); width:min(640px, 90vw); bottom:16px; border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:8px} }

/* ---------- colori nota */
.notebg{background:var(--nbg,var(--n-white))}
.on-light{--fg:#1A1C1E; --muted:#474C52; color:#1A1C1E}
.on-dark{--fg:#F4F5F6; --muted:#D0D4D9; color:#F4F5F6}
.ph{position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none}
.ph img{position:absolute; inset:-30px; width:calc(100% + 60px); height:calc(100% + 60px); object-fit:cover; max-width:none}
.ph .veil{position:absolute; inset:0; background:rgb(var(--veil-rgb))}

/* ---------- editor */
.editor{position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; color:var(--fg)}
.editor > *:not(.ph-slot){position:relative; z-index:1}
.ph-slot{position:absolute; inset:0; z-index:0}
.ed-top{display:flex; align-items:center; gap:2px; padding:calc(6px + env(safe-area-inset-top,0px)) var(--gut-r) 6px calc(var(--gut-l) - 10px)}
.ed-top .grow{flex:1}
.ed-status{font-family:var(--f-mono); font-size:11px; color:var(--muted); padding:0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{width:18px; height:18px; border-radius:9px; border:1.5px solid var(--muted); background:var(--nbg)}
.ed-scroll{flex:1; overflow-y:auto; padding:4px var(--gut-r) 24px var(--gut-l); -webkit-overflow-scrolling:touch}
.ed-inner{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
.ed-title{border:0; outline:0; background:transparent; font-size:22px; font-weight:600; padding:4px 0; width:100%; color:var(--fg)}
.ed-title::placeholder{color:var(--muted)}
.ed-body{position:relative; outline:0; min-height:40vh; font-size:16px; line-height:1.6; overflow-wrap:anywhere; caret-color:var(--accent)}
.ed-body.is-empty::before{content:attr(data-ph); color:var(--muted); position:absolute; pointer-events:none}
.ed-body > div{min-height:1.6em}
.ed-body a{color:inherit}
ul.chk{list-style:none; padding:0; margin:4px 0}
ul.chk li{position:relative; padding-left:30px; min-height:1.6em}
ul.chk li::before{content:""; position:absolute; left:2px; top:.28em; width:16px; height:16px; border:1.6px solid currentColor; border-radius:4px; opacity:.75; cursor:pointer}
ul.chk li.done{color:var(--muted); text-decoration:line-through}
ul.chk li.done::before{background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--surface); opacity:1}

.blk{margin:6px 0; position:relative; user-select:none; -webkit-user-select:none}
.crop{position:relative; overflow:hidden; width:100%; max-width:100%; border-radius:12px; background:color-mix(in srgb, var(--fg) 10%, transparent)}
.crop img{position:absolute; max-width:none; height:auto; display:block}
.blk.img{cursor:zoom-in; max-width:560px}
.badge{position:absolute; left:8px; bottom:8px; background:rgba(20,22,26,.74); color:#fff; font-size:11px; border-radius:10px; padding:3px 8px; font-family:var(--f-sans)}
.badge.r{left:auto; right:8px}
.blk.media{display:flex; flex-direction:column; gap:4px}
.blk audio{width:100%; height:44px}
.blk video{width:100%; max-height:60vh; border-radius:12px; background:#000}
.blk-meta{font-family:var(--f-mono); font-size:11px; color:var(--muted)}
.blk.link a{display:flex; gap:10px; align-items:center; text-decoration:none; color:var(--fg); background:color-mix(in srgb, var(--surface) 75%, transparent); border:1px solid color-mix(in srgb, var(--fg) 12%, transparent); border-radius:12px; padding:8px 10px}
.lk-ico{width:36px; height:36px; border-radius:8px; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none}
.lk-txt{display:flex; flex-direction:column; min-width:0}
.lk-txt b{font-weight:500; font-size:14px}
.lk-txt small{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.blk.loc{display:flex; gap:10px; align-items:center; border:1px solid color-mix(in srgb, var(--fg) 12%, transparent); border-radius:12px; padding:6px 10px 6px 6px; cursor:pointer; background:color-mix(in srgb, var(--surface) 75%, transparent)}
.loc-map{width:64px; height:64px; border-radius:8px; overflow:hidden; position:relative; flex:none;
  background-color:#E6EDE3; background-image:linear-gradient(#D2DCCF 1px, transparent 1px), linear-gradient(90deg, #D2DCCF 1px, transparent 1px); background-size:12px 12px}
.loc-map img{position:absolute; width:128px; height:128px; max-width:none}
.loc-map svg{position:absolute; left:21px; top:16px; width:22px; height:22px}
.loc-txt{display:flex; flex-direction:column; gap:2px; min-width:0}
.loc-txt b{font-weight:500; font-size:14px}
.loc-txt small{font-family:var(--f-mono); font-size:11px; color:var(--muted)}
.blk.quote{padding-left:14px; border-left:3px solid color-mix(in srgb, var(--fg) 25%, transparent); display:flex; flex-direction:column; gap:6px; user-select:text; -webkit-user-select:text}
.blk.quote blockquote{margin:0; font-family:var(--f-serif); font-style:italic; font-size:17px; line-height:1.55; outline:0}
.blk.quote figcaption{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.blk.quote details summary{font-size:12px; color:var(--muted); cursor:pointer; padding:2px 0}
.blk.quote details .crop{margin-top:6px; cursor:zoom-in}
.recbar{display:flex; align-items:center; gap:10px; padding:10px var(--gut-r) 10px var(--gut-l); background:var(--surface); border-top:1px solid var(--line)}
.recdot{width:12px; height:12px; border-radius:6px; background:#D93D2B; animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.ed-tools{border-top:1px solid color-mix(in srgb, var(--fg) 12%, transparent); background:var(--surface); color:var(--fg); padding:4px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.ed-tools .lbl{font-size:11px; color:var(--muted); padding:2px 4px}
.tools{display:flex; overflow-x:auto; scrollbar-width:none; gap:2px}
.tools::-webkit-scrollbar{display:none}
.ed-meta{display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px dashed color-mix(in srgb, var(--fg) 14%, transparent); margin-top:8px}
.row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.row .k{font-size:12px; color:var(--muted); margin-right:2px}
.chip{display:inline-flex; align-items:center; gap:4px; height:30px; border-radius:15px; padding:0 10px; font-size:13px; border:1px solid color-mix(in srgb, var(--fg) 18%, transparent); background:color-mix(in srgb, var(--surface) 70%, transparent); color:var(--fg)}
.chip.on{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
.chip.auto{border-style:solid; background:transparent}
.chip.sug{border-style:dashed; color:var(--muted); background:transparent}
.chip.lnk{border-color:transparent; background:transparent; color:var(--muted); padding:0 6px; font-style:italic}
.chip .x{border:0; background:transparent; padding:0 0 0 2px; display:flex; color:inherit}
.chip .x .ic{width:14px; height:14px}
.chip input{border:0; outline:0; background:transparent; width:110px; font-size:13px}
@media (min-width:900px){
  .editor{left:auto; width:var(--panel); border-left:1px solid var(--line); box-shadow:var(--shadow)}
  body.editing #app{padding-right:calc(var(--panel) + 16px)}
  body.editing .quick{left:calc((100vw - var(--panel)) / 2)}
}

/* ---------- overlay e fogli */
.full{position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--bg); color:var(--fg)}
.full.dark{background:#16181C; color:#F1F2F3; --muted:#A9AEB4; --fg:#F1F2F3}
.fbar{display:flex; align-items:center; gap:4px; padding:calc(6px + env(safe-area-inset-top,0px)) var(--gut-r) 6px calc(var(--gut-l) - 10px)}
.fbar h2{margin:0; font-size:16px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fbar .ib{color:inherit}
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:39}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); color:var(--fg); border-radius:20px 20px 0 0; box-shadow:var(--shadow);
  max-height:88vh; overflow-y:auto; padding:10px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l); box-sizing:border-box}
@media (min-width:640px){ .sheet{left:50%; right:auto; width:560px; transform:translateX(-50%)} }
.grab{display:block; width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 12px}
.sheet h2{margin:0 0 12px; font-size:18px; font-weight:600}
.sheet h3{margin:16px 0 8px; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.05em; text-transform:uppercase}
.sheet p.note{margin:6px 0; font-size:13px; line-height:1.45; color:var(--muted)}
.menu-item{display:flex; align-items:center; gap:14px; width:100%; min-height:50px; border:0; background:transparent; text-align:left; padding:0 6px; font-size:15px; color:var(--fg); border-radius:10px}
.menu-item:hover{background:var(--soft)}
.menu-item .grow{flex:1; display:flex; flex-direction:column; gap:1px}
.menu-item small{font-size:12px; color:var(--muted)}
.menu-item.danger{color:var(--danger)}
.switch{width:50px; height:30px; border-radius:15px; border:0; background:var(--line); position:relative; flex:none; padding:0}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:12px; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:23px}
.switch:disabled{opacity:.45}
.btn{height:46px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:0 16px; font-size:15px; color:var(--fg)}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{height:36px; border-radius:18px; font-size:13px; padding:0 14px}
.btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.btns .btn{flex:1 1 140px}
.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); flex:1}
.field input,.field select,.field textarea{height:42px; border:1px solid var(--line); border-radius:10px; padding:0 12px; font-size:15px; color:var(--fg); background:var(--surface); min-width:0}
.field textarea{height:auto; min-height:120px; padding:10px 12px; line-height:1.5; resize:vertical; font-family:var(--f-serif); font-style:italic}
.check{display:flex; gap:10px; align-items:center; font-size:14px; padding:6px 0}
.check input{width:18px; height:18px; accent-color:var(--accent); flex:none}
.seg{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:2px; background:var(--soft); border-radius:20px; padding:3px; margin-top:12px}
.seg button{height:34px; border:0; border-radius:17px; background:transparent; font-size:13px; color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.sw{width:38px; height:38px; border-radius:19px; border:1px solid color-mix(in srgb, var(--fg) 18%, transparent); padding:0; position:relative; flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--fg)}
.sw .del{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:10px; background:var(--fg); color:var(--bg); display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1}
.sw.add{border:1.5px dashed var(--muted); background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center}
.gprev{height:48px; border-radius:12px; margin:12px 0; border:1px solid var(--line)}
.dirs{display:flex; gap:6px; flex-wrap:wrap}
.range{display:flex; flex-direction:column; gap:6px; margin-top:12px; font-size:14px}
.range .l{display:flex; justify-content:space-between}
.range .l span:last-child{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.range input{width:100%; accent-color:var(--accent)}
.pop{position:fixed; z-index:45; background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:6px; box-shadow:var(--shadow); display:flex; gap:6px; max-width:calc(100vw - 32px); overflow-x:auto}
.pop .sw{width:34px; height:34px}
.toast{position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translate(-50%, 20px); z-index:50; background:#1A1C1E; color:#F4F5F6; padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100vw - 48px); text-align:center}
.toast.on{opacity:1; transform:translate(-50%, 0)}

/* ---------- ritaglio / pagina di libro */
.crop-stage{flex:1; position:relative; min-height:0; touch-action:none}
.crop-stage canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none}
.crop-ctrl{padding:8px var(--gut-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut-l); display:flex; flex-direction:column; gap:10px}
.crop-ctrl .range{margin:0}
.crop-ctrl .range input{accent-color:#FFC93C}
.crop-ctrl .btn{background:#2A2E34; color:#F1F2F3; border-color:#3A3F46}
.crop-ctrl .btn.primary{background:#FFC93C; color:#1A1C1E}
.ocr{background:var(--surface); color:var(--fg); border-radius:20px 20px 0 0; padding:12px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l); display:flex; flex-direction:column; gap:10px; max-height:70vh; overflow-y:auto; --muted:#5C6166}
.ocr .st{font-size:13px; color:var(--muted)}
.full.dark .ocr{--fg:#1A1C1E; --surface:#FFFFFF; --line:#DADDD8; color:#1A1C1E}

/* ---------- visore immagine */
.vw-stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px; overflow:auto}
.vw-wrap{position:relative; display:inline-block; max-width:100%}
.vw-wrap img{display:block; max-width:100%; max-height:calc(100vh - 230px); height:auto}
.vw-wrap.annot{cursor:crosshair}
.pin{position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:13px; background:#FFC93C; color:#1A1C1E; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4)}
.vw-notes{margin:0; padding:0 var(--gut-r) 0 calc(var(--gut-l) + 18px); font-size:14px; line-height:1.5; max-height:22vh; overflow-y:auto}
.vw-notes li{padding:2px 0}
.vw-ctrl{display:flex; gap:8px; flex-wrap:wrap; padding:10px var(--gut-r) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.vw-ctrl .btn{background:#2A2E34; color:#F1F2F3; border-color:#3A3F46; flex:1 1 120px}
.vw-ctrl .btn.primary{background:#FFC93C; color:#1A1C1E}
.vw-ctrl input{flex:2 1 200px; height:46px; border-radius:12px; border:1px solid #3A3F46; background:#22262C; color:#F1F2F3; padding:0 12px}

/* ---------- mappa */
.map-stage{flex:1; position:relative; overflow:hidden; background:#E6EDE3; touch-action:none; cursor:grab}
.map-stage img{position:absolute; width:256px; height:256px; max-width:none; user-select:none; -webkit-user-drag:none}
.map-pin{position:absolute; width:30px; height:30px; margin:-28px 0 0 -15px; pointer-events:none}
.map-attr{position:absolute; right:6px; bottom:4px; font-size:11px; background:rgba(255,255,255,.85); color:#1A1C1E; padding:1px 6px; border-radius:4px}
.map-zoom{position:absolute; right:12px; top:12px; display:flex; flex-direction:column; gap:6px}
.map-zoom button{width:44px; height:44px; border-radius:22px; border:0; background:#fff; color:#1A1C1E; font-size:22px; box-shadow:0 1px 4px rgba(0,0,0,.3)}
.map-info{padding:12px var(--gut-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut-l); display:flex; flex-direction:column; gap:6px; font-size:14px}
.map-info small{font-family:var(--f-mono); color:var(--muted)}
.map-info a{color:var(--accent)}

/* ---------- cronologia */
.hist-body{flex:1; overflow-y:auto; padding:0 var(--gut-r) 24px var(--gut-l)}
.hist-in{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
.hist-prev{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.hist-prev .t{font-weight:600}
.hist-prev .b{font-size:14px; line-height:1.55; max-height:40vh; overflow-y:auto; overflow-wrap:anywhere}
.hist-prev .b .blk{pointer-events:none}
.diff{font-size:14px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; max-height:30vh; overflow-y:auto}
.diff ins{background:#D8F0DF; color:#155A2C; text-decoration:none}
.diff del{background:#FBE0DC; color:#8A1F12}
.vlist{display:flex; flex-direction:column}
.vitem{display:flex; gap:14px; border:0; background:transparent; text-align:left; padding:0; color:var(--fg)}
.vitem .rail{width:14px; display:flex; flex-direction:column; align-items:center}
.vitem .rail i{width:12px; height:12px; border-radius:6px; border:2px solid var(--muted); margin-top:14px; box-sizing:border-box; background:var(--bg)}
.vitem .rail b{flex:1; width:2px; background:var(--line)}
.vitem[aria-current="true"] .rail i{background:var(--accent); border-color:var(--accent)}
.vitem .vt{flex:1; padding:10px 0; display:flex; justify-content:space-between; gap:8px; font-size:14px}
.vitem .vt small{font-family:var(--f-mono); font-size:11px; color:var(--muted); flex:none}
.vitem[aria-current="true"] .vt span{font-weight:600}

/* ---------- orbita (sempre "spazio" scuro, per scelta) */
.full.orbit{z-index:18; background:#121419; color:#F1F2F3; --muted:#A9AEB4; --fg:#F1F2F3}
.orbit canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none}
.orbit .fbar,.orbit .modes,.orbit .osheet{position:relative; z-index:1}
.modes{display:flex; gap:6px; overflow-x:auto; padding:2px var(--gut-r) 8px var(--gut-l); scrollbar-width:none}
.modes button{height:36px; border-radius:18px; border:0; background:#22262E; color:#C5CAD1; padding:0 14px; font-size:13px; flex:none}
.modes button[aria-pressed="true"]{background:#F1F2F3; color:#121419; font-weight:600}
.osheet{margin-top:auto; background:var(--surface); color:var(--fg); border-radius:20px 20px 0 0; padding:12px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l); display:flex; flex-direction:column; gap:10px; --fg:#1A1C1E; --muted:#5C6166; --surface:#FFFFFF; --line:#DADDD8; --soft:#ECEDEA; color:#1A1C1E}
@media (min-width:640px){ .osheet{align-self:center; width:560px; box-sizing:border-box} }
.osheet .ot{font-weight:600; font-size:15px}
.osheet p{margin:0; font-size:13px; line-height:1.45; color:#2C2F33; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.sug{background:var(--soft); border-radius:10px; padding:8px 10px; display:flex; gap:8px; align-items:center; font-size:13px}
.sug span{flex:1; min-width:0}
.hint{font-size:12px; color:var(--muted)}

/* ---------- selezione multipla */
.selbar{position:fixed; left:0; right:0; top:0; z-index:9; display:flex; align-items:center; gap:2px; background:var(--surface); color:var(--fg); box-shadow:var(--shadow);
  padding:calc(8px + env(safe-area-inset-top,0px)) var(--gut-r) 8px calc(var(--gut-l) - 8px)}
.selbar .count{flex:1; min-width:0; font-size:17px; font-weight:500; padding-left:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.selbar .ib.on{color:var(--accent)}
.card{transition:box-shadow .2s, border-color .2s, transform .15s}
.card:active{transform:scale(.985)}
.card > .tick{position:absolute; top:7px; right:7px; z-index:3; width:24px; height:24px; border-radius:12px; box-sizing:border-box; display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:2px solid var(--muted); color:transparent; opacity:0; transform:scale(.5); transition:opacity .18s, transform .22s cubic-bezier(.2,.8,.2,1.4), background .18s, border-color .18s; pointer-events:none}
.card > .tick .ic{width:15px; height:15px; stroke-width:2.8}
body.selecting .card > .tick{opacity:.85; transform:none}
body.selecting .card.pinned::after{opacity:0}
.card h3,.card .cq-src{padding-right:26px}
.toast span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card.sel > .tick{background:var(--accent); border-color:var(--accent); color:var(--accent-fg); opacity:1}
.card.sel{box-shadow:0 0 0 2px var(--accent); border-color:transparent}
.quick{transition:translate .28s cubic-bezier(.2,.8,.2,1)}
body.selecting .quick{translate:0 140%}
.toast{display:flex; align-items:center; gap:14px}
.toast.act{pointer-events:auto}
.tbtn{border:0; background:transparent; color:#AFC0FF; font-weight:600; font-size:14px; padding:6px 2px}
ul.chk li::before{transition:background .15s, box-shadow .15s}
.seg button{transition:background .2s, box-shadow .2s}
.chip,.sw,.ib,.btn{transition:background .15s, transform .12s, box-shadow .15s}
.btn:active,.ib:active,.sw:active{transform:scale(.96)}
.pop{transform-origin:50% 0}

.round.sync{position:relative}
.sdot{position:absolute; top:8px; right:8px; width:10px; height:10px; border-radius:5px; background:transparent; box-shadow:0 0 0 2px var(--surface); transition:background .2s}
.sync[data-state=pending] .sdot{background:var(--accent)}
.sync[data-state=auth] .sdot{background:#D98A1E}
.sync[data-state=err] .sdot{background:var(--danger)}
.sync[data-state=busy] .ic{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:420px){ .top .round{width:44px; height:44px} .search{padding:0 12px} }

@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

</style>
</head>

<div id="app">
  <header class="top">
    <label class="search"><svg class="ic s"><use href="#i-search"/></svg><span class="vh">Cerca</span>
      <input id="q" type="search" placeholder="Cerca nelle note" autocomplete="off" enterkeyhint="search"></label>
    <button id="btnOrbit" class="round" aria-label="Vista orbita"><svg class="ic"><use href="#i-orbit"/></svg></button>
    <button id="btnSync" class="round sync" hidden aria-label="Sincronizzazione"><svg class="ic"><use href="#i-sync"/></svg><span class="sdot"></span></button>
    <button id="btnSettings" class="round" aria-label="Impostazioni"><svg class="ic"><use href="#i-gear"/></svg></button>
  </header>
  <div class="subbar">
    <span id="countLbl">Tutte le note</span>
    <span id="activeFilter"></span>
    <span class="grow"></span>
    <button id="btnFilter" class="ghost"><svg class="ic s"><use href="#i-tag"/></svg>Filtra</button>
  </div>
  <div id="selbar" class="selbar" hidden role="toolbar" aria-label="Note selezionate">
    <button id="selClose" class="ib" aria-label="Annulla selezione"><svg class="ic"><use href="#i-close"/></svg></button>
    <span id="selCount" class="count" aria-live="polite">1 selezionata</span>
    <button id="selAll" class="ib" aria-label="Seleziona tutte"><svg class="ic"><use href="#i-checkall"/></svg></button>
    <button id="selPin" class="ib" aria-label="Fissa in alto"><svg class="ic"><use href="#i-pinup"/></svg></button>
    <button id="selColor" class="ib" aria-label="Cambia colore"><svg class="ic"><use href="#i-palette"/></svg></button>
    <button id="selShare" class="ib" aria-label="Condividi"><svg class="ic"><use href="#i-share"/></svg></button>
    <button id="selDelete" class="ib" aria-label="Elimina"><svg class="ic"><use href="#i-trash"/></svg></button>
  </div>
  <main id="board" class="board" aria-label="Bacheca"></main>
  <div id="empty" class="empty" hidden></div>
  <footer class="quick">
    <button id="qNew" class="quick-new">Scrivi una nota…</button>
    <button id="qBook" class="ib" aria-label="Pagina di libro"><svg class="ic"><use href="#i-book"/></svg></button>
    <button id="qPhoto" class="ib" aria-label="Foto"><svg class="ic"><use href="#i-camera"/></svg></button>

<section id="orbit" class="full orbit" hidden aria-label="Orbita">
  <canvas id="orbCv"></canvas>
  <div class="fbar">
    <button id="orbBack" class="ib" aria-label="Torna alla bacheca"><svg class="ic"><use href="#i-back"/></svg></button>
    <h2>Orbita</h2>
  </div>
  <div class="modes" id="orbModes"></div>
  <div class="osheet" id="orbSheet"></div>

<section id="crop" class="full dark" hidden aria-label="Ritaglio">
  <div class="fbar">
    <button id="cropClose" class="ib" aria-label="Annulla"><svg class="ic"><use href="#i-close"/></svg></button>
    <h2 id="cropTitle">Ritaglia</h2>
    <button id="cropRot90" class="ib" aria-label="Ruota di 90 gradi"><svg class="ic"><use href="#i-rotate"/></svg></button>
  </div>
  <div class="crop-stage" id="cropStage"><canvas id="cropCv"></canvas></div>
  <div class="crop-ctrl" id="cropCtrl">
    <label class="range"><span class="l"><span>Raddrizza</span><span id="cropDeg">0°</span></span>
      <input id="cropFine" type="range" min="-45" max="45" step="0.5" value="0"></label>

<script>
'use strict';
(() => {
/* =========================================================================

const $ = (s, r = document) => r.querySelector(s);

const uid = (p = 'n') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

}
const FULL_IN = [{ opacity: 0, transform: 'scale(.985)' }, { opacity: 1, transform: 'none' }], FULL_OUT = [{ opacity: 1 }, { opacity: 0, transform: 'scale(.985)' }];
const showFull = el => show(el, FULL_IN, { duration: 240 }), hideFull = el => hide(el, FULL_OUT, { duration: 180 });

function hhmm(d) { return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); }

}
function fmtDur(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function hexToRgb(h) { h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function dataURLToBlob(d) { const [h, b] = d.split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream'; const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); }

/* ---------------------------------------------------------------- storage */

  const os = (s, m) => db.transaction(s, m).objectStore(s);
  return {
    async open() {

          const r = indexedDB.open('taccuino', 1);
          r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('notes', { keyPath: 'id' }); d.createObjectStore('versions', { keyPath: 'id' }).createIndex('note', 'noteId'); d.createObjectStore('blobs'); d.createObjectStore('meta'); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));

})();

const urlCache = new Map();

/* ---------------------------------------------------------------- stato */
const DEFAULT_PALETTE = [
  { t: 'tok', id: 'white', name: 'Nessun colore' }, { t: 'tok', id: 'yellow', name: 'Giallo' }, { t: 'tok', id: 'green', name: 'Verde' },
  { t: 'tok', id: 'blue', name: 'Blu' }, { t: 'tok', id: 'pink', name: 'Rosa' }, { t: 'tok', id: 'gray', name: 'Grigio' },
  { t: 'tok', id: 'orange', name: 'Arancio' }, { t: 'tok', id: 'purple', name: 'Viola' }

const S = {
  notes: new Map(), cur: null, curNew: false, force: false,
  settings: { palette: DEFAULT_PALETTE.map(x => ({ ...x })), newSync: true, lang: 'it', lastBook: '', books: [], orbitMode: 'Argomento' },
  filter: { q: '', label: null, kind: null, color: null }, savedRange: null, sel: new Set(), lastSel: null

/* ---------------------------------------------------------------- colori */
function colorAttrs(c) {
  c = c || { t: 'tok', id: 'white' };

  if (c.t === 'solid') return { bg: c.c, cls: lum(c.c) < .4 ? 'on-dark' : 'on-light' };

}
function swatchBg(c) { return colorAttrs(c).bg; }
function colorKey(c) { c = c || {}; return c.t === 'tok' ? c.id : c.t === 'solid' ? c.c : c.t === 'grad' ? 'grad' : c.t === 'photo' ? 'photo' : 'white'; }
function colorName(c) { c = c || {}; if (c.t === 'tok') return (DEFAULT_PALETTE.find(p => p.id === c.id) || {}).name || c.id; return { solid: 'personalizzato', grad: 'gradiente', photo: 'foto' }[c.t] || 'nessun colore'; }
function solidHex(c) { c = c || { t: 'tok', id: 'white' }; if (c.t === 'tok') return cssVar('--n-' + c.id) || '#ffffff'; if (c.t === 'solid') return c.c; if (c.t === 'grad') return c.a; return cssVar('--n-gray') || '#ececec'; }
function applyColor(target, c, slot) {

  target.classList.remove('on-dark', 'on-light', 'has-photo'); if (a.cls) target.classList.add(a.cls);

}

/* ---------------------------------------------------------------- blocchi */
function cropStyle(crop, ar) { const [x, y, w, h] = crop; return { box: `aspect-ratio:${((w / h) * ar).toFixed(4)}`, img: `width:${(100 / w).toFixed(3)}%;left:${(-x / w * 100).toFixed(3)}%;top:${(-y / h * 100).toFixed(3)}%` }; }

function videoBlock(id) { return el(`<figure class="blk media" contenteditable="false" data-type="video"><video controls playsinline preload="metadata" data-blob="${esc(id)}"></video></figure>`); }

}

  const paras = o.text.split(/\n{2,}/).map(esc).join('<br><br>');
  const cap = [o.book, o.page ? 'p. ' + o.page : ''].filter(Boolean).join(' · ');
  const f = el(`<figure class="blk quote" contenteditable="false" data-type="quote"><blockquote contenteditable="true" spellcheck="true">${paras}</blockquote>${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}${o.blob ? `<details${o.collapse ? '' : ' open'}><summary>Foto della pagina</summary><div class="qimg" data-src="${esc(o.blob)}" data-ar="${o.ar}" data-crop="${o.crop.join(',')}">${cropHTML(o.blob, o.crop, o.ar)}</div></details>` : ''}</figure>`);

/* ---------------------------------------------------------------- classificazione */
const STOP = new Set(('che per con non una uno del della delle dei degli dello nel nella nelle negli sul sulla sulle sui come anche piu questo questa questi queste quello quella quelli essere fare dopo prima poi gia tra fra dal dalla dai alla alle agli allo all gli il lo la le un di da in su ma se ed ho hai ha hanno abbiamo sono era erano molto poco tutto tutti cosa quando dove perche quindi oppure ancora sempre mai solo ogni nota note ' +
  'the and for with that this from are was were have has not you your will would can could should about into than then them they there their what when which who ' +
  'les des une est pour dans par sur pas qui que avec ces son sont aux du au ou et en elle ils nous vous mais plus tout comme fait etre avoir').split(/\s+/));
function toks(s) { return (String(s || '').toLowerCase().match(/[\p{L}\p{N}]{3,}/gu) || []).filter(w => !STOP.has(normTxt(w))); }
const tfCache = new Map();
function tf(n) { const c = tfCache.get(n.id); if (c && c.at === n.updatedAt) return c.tf; const m = new Map(); for (const w of toks(n.title + ' ' + n.title + ' ' + n.text)) m.set(w, (m.get(w) || 0) + 1); tfCache.set(n.id, { at: n.updatedAt, tf: m }); return m; }

function cos(a, b) { let s = 0; const [sm, lg] = a.size < b.size ? [a, b] : [b, a]; for (const [w, x] of sm) { const y = lg.get(w); if (y) s += x * y; } return s; }
function labelScores(n) {
  const I = idf(), v = vecOf(n, I), C = new Map();
  for (const m of S.notes.values()) {
    if (m.id === n.id || !m.labels.length) continue;
    const mv = vecOf(m, I);
    for (const L of m.labels) { let c = C.get(L); if (!c) { c = new Map(); C.set(L, c); } for (const [w, x] of mv) c.set(w, (c.get(w) || 0) + x); }
  }
  const out = [];
  for (const [L, c] of C) { let s = 0; for (const x of c.values()) s += x * x; s = Math.sqrt(s) || 1; let d = 0; for (const [w, x] of v) { const y = c.get(w); if (y) d += x * y / s; } out.push([L, d]); }
  return out.sort((a, b) => b[1] - a[1]);
}
function effLabels(n) { return [...new Set([...(n.labels || []), ...(n.autoLabels || []).filter(l => !(n.rejected || []).includes(l))])]; }
function computeAuto(n) {
  if (!(n.text || n.title)) { n.autoLabels = []; return; }
  n.autoLabels = labelScores(n).filter(([L, s]) => s >= .22 && !n.labels.includes(L) && !n.rejected.includes(L)).slice(0, 2).map(x => x[0]);
}
function suggestions(n) {
  const eff = new Set(effLabels(n));
  const out = labelScores(n).filter(([L, s]) => s >= .07 && !eff.has(L) && !n.rejected.includes(L)).slice(0, 3).map(x => x[0]);

function placeCaretEnd(node) { node.focus(); const r = document.createRange(); r.selectNodeContents(node); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); S.savedRange = r.cloneRange(); }

function insertBlock(node) {
  const body = E.body; let r = S.savedRange;
  const s = getSelection(); if (s.rangeCount && body.contains(s.anchorNode)) r = s.getRangeAt(0);
  if (!r || !body.contains(r.startContainer)) { r = document.createRange(); r.selectNodeContents(body); r.collapse(false); }
  const start = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
  const fig = start.closest && start.closest('figure.blk');
  if (fig && body.contains(fig)) { r = document.createRange(); r.setStartAfter(fig); r.collapse(true); }
  else {
    // porta il blocco a livello di riga: dopo la riga corrente se il cursore è dentro un div/li
    let line = start; while (line && line.parentElement !== body && line !== body) line = line.parentElement;
    if (line && line !== body && line.parentElement === body) {
      const atEnd = (() => { const t = document.createRange(); t.selectNodeContents(line); t.setStart(r.endContainer, r.endOffset); return !t.toString().length; })();
      const emptyLine = !line.textContent.trim() && !$('figure,img', line);

      if (atEnd) r.setStartAfter(line); else r.setStartBefore(line);

    }
  }
  r.insertNode(node); popIn(node);

}

function popIn(node) { anim(node, [{ opacity: 0, transform: 'translateY(8px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 280 }); }

/* salvataggio + versioni */
let saveT = null;
function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveCurrent, 700); E.status.textContent = 'modifiche…'; }
function serializeBody() {
  const c = E.body.cloneNode(true);
  $$('[data-blob]', c).forEach(x => x.removeAttribute('src'));
  $$('.is-empty', c).forEach(x => x.classList.remove('is-empty'));
  let html = c.innerHTML.trim(); if (html === '<br>' || html === '<div><br></div>') html = '';
  return html;
}
async function saveCurrent() {
  clearTimeout(saveT); saveT = null;
  const n = S.cur; if (!n) return;
  const html = serializeBody(), title = E.title.value.trim();
  const changed = html !== n.html || title !== n.title;
  if (!changed && !S.force) { renderStatus(); return; }
  S.force = false;
  if (changed) {
    n.html = html; n.title = title;
    n.text = textOf(E.body);
    n.kinds = kindsOf(E.body); n.place = placeOf(E.body);
    for (const m of n.text.matchAll(/#([\p{L}\p{N}_-]{2,})/gu)) { const L = m[1].toLowerCase(); if (!n.labels.includes(L) && !n.rejected.includes(L)) n.labels.push(L); }
  }
  n.updatedAt = Date.now();
  if (isEmptyNote(n) && S.curNew) { renderStatus(); return; }
  computeAuto(n);
  S.curNew = false;
  await persist(n);
  if (changed) await snapshot(n);
  renderStatus(); renderMeta();
  if (WIDE()) queueBoard();
}
async function snapshot(n) {
  const vs = (await Store.versions(n.id)).sort((a, b) => a.at - b.at); const last = vs[vs.length - 1];
  if (last && last.html === n.html && last.title === n.title) return;
  if (last && Date.now() - last.at < 90000 && vs.length > 1) { Object.assign(last, { html: n.html, title: n.title, text: n.text, at: Date.now() }); await Store.put('versions', last); }
  else await Store.put('versions', { id: uid('v'), noteId: n.id, at: Date.now(), html: n.html, title: n.title, text: n.text });
  n.vcount = (vs.length || 0) + (last && Date.now() - last.at < 90000 && vs.length > 1 ? 0 : 1);
}

  if (n.vcount == null) n.vcount = (await Store.versions(n.id)).length;
  E.status.textContent = `modificata ${fmtTime(n.updatedAt)} · ${n.vcount} version${n.vcount === 1 ? 'e' : 'i'}${n.sync ? '' : ' · solo qui'}`;
}

/* posizione */
function locate() {
  if (!navigator.geolocation) return toast('La posizione non è disponibile su questo dispositivo');
  toast('Cerco la posizione…', 8000);
  navigator.geolocation.getCurrentPosition(async p => {
    const { latitude: lat, longitude: lon, accuracy: acc } = p.coords;
    const f = locBlock({ lat, lon, acc, t: Date.now() }); insertBlock(f); toast('Posizione inserita');
    const name = await reverseGeo(lat, lon);
    if (name && f.isConnected) { f.dataset.name = name; $('b', f).textContent = name; scheduleSave(); }
  }, err => {
    toast(err.code === 1 ? (IN_FRAME ? 'Qui la posizione è bloccata: funziona nella versione installata' : 'Permesso di posizione negato') : 'Posizione non trovata, riprova all\'aperto');
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}
async function reverseGeo(lat, lon) {
  try {
    const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 6000);
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=17&accept-language=${S.settings.lang || 'it'}`, { signal: ac.signal });
    clearTimeout(t); if (!r.ok) return ''; const d = await r.json(); const a = d.address || {};
    return d.name || [a.road, a.suburb || a.village || a.town || a.city].filter(Boolean).join(', ') || '';
  } catch (e) { return ''; }
}

/* registrazione audio */
let rec = null;
async function startRec() {
  if (rec) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('Registrazione non disponibile su questo dispositivo');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return toast(IN_FRAME ? 'Qui il microfono è bloccato: funziona nella versione installata' : 'Permesso microfono negato'); }
  const mr = new MediaRecorder(stream); const chunks = [];
  mr.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
  rec = { mr, stream, chunks, t0: Date.now(), cancel: false, timer: setInterval(() => { $('#recTime').textContent = fmtDur((Date.now() - rec.t0) / 1000); }, 250) };
  mr.onstop = async () => {
    const r = rec; rec = null; clearInterval(r.timer); r.stream.getTracks().forEach(t => t.stop()); $('#recBar').hidden = true;
    if (r.cancel || !r.chunks.length) return;
    const blob = new Blob(r.chunks, { type: mr.mimeType || 'audio/webm' }); const id = await putBlob(blob);
    if (S.cur) insertBlock(audioBlock(id, (Date.now() - r.t0) / 1000));
  };
  mr.start(250); $('#recTime').textContent = '0:00'; $('#recBar').hidden = false;
}

$('#recCancel').addEventListener('click', () => stopRec(true));

const C = { cv: $('#cropCv'), src: null, w: 0, h: 0, base: 0, fine: 0, r: null, mode: 'image', res: null, drag: null, dpr: 1, pending: null };

  const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  Object.assign(C, { src: cv, w: cv.width, h: cv.height, base: 0, fine: 0, mode, preset });
  const pc = preset.crop; C.r = pc ? { x: pc[0], y: pc[1], w: pc[2], h: pc[3] } : mode === 'book' ? { x: .08, y: .2, w: .84, h: .3 } : { x: 0, y: 0, w: 1, h: 1 };
  $('#cropTitle').textContent = mode === 'book' ? 'Pagina di libro · seleziona il passo' : preset.edit ? 'Modifica ritaglio' : 'Ritaglia immagine';
  $('#cropGo').textContent = mode === 'book' ? 'Estrai testo' : preset.edit ? 'Salva' : 'Inserisci';
  $('#cropFine').value = 0; $('#cropDeg').textContent = '0°';

  const col = C.mode === 'book' ? '#FFC93C' : '#FFFFFF';
  if (C.mode === 'book') { ctx.fillStyle = 'rgba(255,201,60,.12)'; ctx.fillRect(rx, ry, rw, rh); }
  ctx.strokeStyle = col; ctx.lineWidth = 2 * d; ctx.strokeRect(rx, ry, rw, rh);

  const st = $('#ocrSt'), ta = $('#ocrText'); ta.value = ''; ta.disabled = true; st.textContent = 'Preparo il riconoscimento…';

  ocrProg = (p, s) => { st.textContent = p != null ? `Riconoscimento ${Math.round(p * 100)}%` : (s === 'loading language traineddata' ? 'Scarico le lingue (solo la prima volta)…' : 'Preparo il riconoscimento…'); };
  try {
    await loadScript(TESS);
    const timeout = (ms, p) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('tempo scaduto')), ms))]);

async function exportBackup() {
  toast('Preparo il backup…');
  const notes = [...S.notes.values()], versions = await Store.all('versions'), keys = await Store.keys('blobs'), blobs = {};
  for (const k of keys) { const b = await Store.get('blobs', k); if (b) blobs[k] = await blobToDataURL(b); }
  const data = JSON.stringify({ app: 'taccuino', v: 1, at: Date.now(), notes, versions, blobs, settings: S.settings });
  const filename = `taccuino-backup-${new Date().toISOString().slice(0, 10)}.json`;
  if (IN_FRAME) {
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (!dl) return toast('Qui il download non è disponibile: usa la versione installata');
    try { const r = await dl.save({ filename, data }); if (r.status === 'saved') toast('Backup salvato'); }
    catch (e) { if (e.code !== 'declined') toast('Download non riuscito'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Backup scaricato');
}

async function importKeep(file, opt, st) {
  await loadScript(JSZIP);
  const zip = await JSZip.loadAsync(file);
  const files = Object.values(zip.files).filter(z => !z.dir);
  const jsons = files.filter(z => /\.json$/i.test(z.name) && !/Labels\.txt$/i.test(z.name));
  const byName = new Map(); for (const z of files) { const base = z.name.split('/').pop().toLowerCase(); byName.set(base, z); byName.set(base.replace(/\.[^.]+$/, ''), z); }
  const existing = new Set([...S.notes.values()].map(n => n.keepId).filter(Boolean));
  let done = 0, skipped = 0;
  for (const z of jsons) {
    let k; try { k = JSON.parse(await z.async('string')); } catch (e) { continue; }
    if (typeof k !== 'object' || !('textContent' in k || 'listContent' in k || 'title' in k)) continue;
    const keepId = z.name.split('/').pop();
    if (existing.has(keepId)) { skipped++; continue; }
    if (k.isTrashed) continue; if (k.isArchived && !opt.arc) continue;
    const root = document.createElement('div');
    if (k.textContent) for (const line of String(k.textContent).split('\n')) { const d = document.createElement('div'); if (line) d.textContent = line; else d.innerHTML = '<br>'; root.appendChild(d); }
    if (Array.isArray(k.listContent) && k.listContent.length) { const ul = document.createElement('ul'); ul.className = 'chk'; for (const it of k.listContent) { const li = document.createElement('li'); li.textContent = it.text || ''; if (it.isChecked) li.className = 'done'; ul.appendChild(li); } root.appendChild(ul); }
    for (const at of k.attachments || []) {
      const p = String(at.filePath || ''), base = p.split('/').pop().toLowerCase();
      const zf = byName.get(base) || byName.get(base.replace(/\.[^.]+$/, '')); if (!zf) continue;
      const blob = new Blob([await zf.async('arraybuffer')], { type: at.mimetype || '' }); const id = await putBlob(blob);
      if ((at.mimetype || '').startsWith('image/') || /\.(jpe?g|png|gif|webp)$/i.test(zf.name)) { let ar = 1; try { const im = await loadImage(blob); ar = im.naturalWidth / im.naturalHeight; } catch (e) { } root.appendChild(imageBlock(id, ar)); }
      else if ((at.mimetype || '').startsWith('audio/') || /\.(3gp|m4a|amr|mp3|ogg|webm)$/i.test(zf.name)) root.appendChild(audioBlock(id, 0));
      else if ((at.mimetype || '').startsWith('video/')) root.appendChild(videoBlock(id));
    }
    for (const an of k.annotations || []) if (an.url) root.appendChild(linkBlock(an.url, an.title));
    const n = newNote();
    n.keepId = keepId; n.title = k.title || ''; n.html = cleanHTML(root);
    n.text = textOf(root);
    n.kinds = kindsOf(root);
    n.createdAt = k.createdTimestampUsec ? Math.round(k.createdTimestampUsec / 1000) : Date.now();
    n.updatedAt = k.userEditedTimestampUsec ? Math.round(k.userEditedTimestampUsec / 1000) : n.createdAt;
    if (opt.lbl) n.labels = (k.labels || []).map(l => String(l.name || '').toLowerCase()).filter(Boolean);
    if (opt.col && KEEP_COLORS[k.color]) n.color = { t: 'tok', id: KEEP_COLORS[k.color] };
    n.pinned = !!k.isPinned; n.sync = !opt.local;
    await persist(n);
    await Store.put('versions', { id: uid('v'), noteId: n.id, at: n.updatedAt, html: n.html, title: n.title, text: n.text });
    done++; if (done % 10 === 0) st(`Importate ${done} note…`);
  }
  for (const n of S.notes.values()) computeAuto(n);
  renderBoard();
  st(`Fatto: ${done} note importate${skipped ? `, ${skipped} già presenti` : ''}.`);
  toast(`Importate ${done} note da Keep`);
}

/* ---------------------------------------------------------------- sincronizzazione cifrata (Google Drive) */
const CFG = window.TACCUINO_CONFIG || {};
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const GAPI = 'https://www.googleapis.com';
const te = s => new TextEncoder().encode(s), td = u => new TextDecoder().decode(u);
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const hex = u => [...u].map(b => b.toString(16).padStart(2, '0')).join('');
const b64 = {
  enc(u) { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); },
  dec(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
};
const B32 = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function b32enc(u) { let bits = 0, val = 0, out = ''; for (const b of u) { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } } if (bits) out += B32[(val << (5 - bits)) & 31]; return out; }
function b32dec(s) {
  s = s.toUpperCase().replace(/[^A-Z0-9]/g, '');
  let bits = 0, val = 0; const out = [];
  for (const c of s) { const i = B32.indexOf(c); if (i < 0) throw new Error('carattere'); val = (val << 5) | i; bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  return new Uint8Array(out);
}
const groupCode = c => c.match(/.{1,4}/g).join('-');
async function gz(u, compress) { const st = compress ? new CompressionStream('gzip') : new DecompressionStream('gzip'); return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(st)).arrayBuffer()); }

const Crypto = {
  async keys(mk) {
    const base = await crypto.subtle.importKey('raw', mk, 'HKDF', false, ['deriveKey']);
    const p = info => ({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(32), info: te(info) });
    return {
      enc: await crypto.subtle.deriveKey(p('taccuino/enc/1'), base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']),
      mac: await crypto.subtle.deriveKey(p('taccuino/name/1'), base, { name: 'HMAC', hash: 'SHA-256', length: 256 }, false, ['sign'])
    };
  },
  async kek(pass, salt, iter) {
    const base = await crypto.subtle.importKey('raw', te(pass.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async seal(key, u, z = true) {
    let data = u, f = 0;
    if (z && 'CompressionStream' in window) { data = await gz(u, true); f = 1; }
    const iv = rand(12), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data));
    const out = new Uint8Array(16 + ct.length); out.set([84, 81, 49, f]); out.set(iv, 4); out.set(ct, 16); return out;
  },
  async open(key, u) {
    if (u[0] !== 84 || u[1] !== 81 || u[2] !== 49) throw new Error('formato sconosciuto');
    const pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(4, 16) }, key, u.subarray(16)));
    return u[3] ? gz(pt, false) : pt;
  },
  async makeKeyring(pass, mk) {
    const salt = rand(16), iter = 600000, kek = await this.kek(pass, salt, iter), iv = rand(12);
    const wrapped = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, kek, mk));
    const K = await this.keys(mk), check = await this.seal(K.enc, te('taccuino-ok'), false);
    return { v: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64.enc(salt), iv: b64.enc(iv), wrapped: b64.enc(wrapped), check: b64.enc(check) };
  },
  async unlock(kr, pass) {
    const kek = await this.kek(pass, b64.dec(kr.salt), kr.iter);
    try { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(kr.iv) }, kek, b64.dec(kr.wrapped))); }
    catch (e) { throw new Error('frase'); }
  },
  async verify(kr, mk) { const K = await this.keys(mk); await this.open(K.enc, b64.dec(kr.check)); return K; }
};

const Drive = {
  async req(method, url, o = {}) {
    let r;
    try { r = await fetch(url.startsWith('http') ? url : GAPI + url, { method, body: o.body, headers: { Authorization: 'Bearer ' + Sync.token, ...(o.headers || {}) } }); }
    catch (e) { throw Object.assign(new Error('rete'), { net: true }); }
    if (r.status === 401) { Sync.token = null; throw Object.assign(new Error('accesso scaduto'), { auth: true }); }
    if (!r.ok) throw new Error('Drive ' + r.status);
    if (o.raw) return r; return r.status === 204 ? null : r.json();
  },
  async list() {
    const out = []; let pt = '';
    do {
      const q = new URLSearchParams({ spaces: 'appDataFolder', pageSize: '1000', fields: 'nextPageToken,files(id,name,modifiedTime,size,appProperties)' });
      if (pt) q.set('pageToken', pt);
      const d = await this.req('GET', '/drive/v3/files?' + q); out.push(...(d.files || [])); pt = d.nextPageToken;
    } while (pt);
    return out;
  },

    mk({ title: '', html: '<figure class="blk quote" contenteditable="false" data-type="quote" data-book="Il Saggiatore — G. Galilei" data-page="25"><blockquote contenteditable="true">La filosofia è scritta in questo grandissimo libro che continuamente ci sta aperto innanzi a gli occhi (io dico l\'universo).</blockquote><figcaption>Il Saggiatore — G. Galilei · p. 25</figcaption></figure>', color: { t: 'tok', id: 'yellow' }, labels: ['esempio', 'letture'], sync: false }, 864e5),
    mk({ title: 'Idee per il weekend', html: '<div>Sentiero dopo il ponte, circa 40 minuti di salita. Tornare in primavera con il treppiede.</div>', color: { t: 'grad', a: '#FFE29A', b: '#F7B2C4', dir: '135deg', name: 'Gradiente' }, labels: ['esempio'], sync: false }, 3 * 864e5)
  ];
  for (const n of notes) {
    const t = document.createElement('div'); t.innerHTML = n.html; t.style.cssText = 'position:absolute;left:-9999px;width:600px'; document.body.appendChild(t);
    n.text = t.innerText.trim(); n.kinds = kindsOf(t); t.remove();
    await persist(n); await Store.put('versions', { id: uid('v'), noteId: n.id, at: n.updatedAt, html: n.html, title: n.title, text: n.text });
  }
  await Store.put('meta', true, 'seeded');
}
async function boot() {
  await Store.open();
  try { const s = await Store.get('meta', 'settings'); if (s) S.settings = Object.assign(S.settings, s); } catch (e) { }
  if (!S.settings.palette?.length) S.settings.palette = DEFAULT_PALETTE.map(x => ({ ...x }));
  for (const n of await Store.all('notes')) S.notes.set(n.id, fixNote(n));
  if (!S.notes.size && !(await Store.get('meta', 'seeded'))) await seed();
  for (const n of S.notes.values()) if (!n.autoLabels) computeAuto(n);
  renderBoard();
  Sync.init();
  if (!IN_FRAME && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!IN_FRAME && navigator.storage?.persist) navigator.storage.persist().catch(() => { });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveCurrent(); });
}
boot();
})();
